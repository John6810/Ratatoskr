apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Component-specific labels for unit3d-migrate. includeSelectors: false
# (selectors are immutable post-create); the minimal selector
# (app.kubernetes.io/name: unit3d-migrate) is set explicitly on the Job
# template via spec.template.metadata.labels — the Job's controller-
# generated selector matches via job-name automatically, so we don't
# touch spec.selector.
#
# The unit3d-config ConfigMap and unit3d-storage PVC defined here are
# shared across unit3d-app, unit3d-queue, and unit3d-scheduler when
# those components land — same names, no duplication.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: unit3d-migrate
      app.kubernetes.io/component: migration

resources:
  - job.yaml
  - configmap.yaml
  - pvc.yaml
