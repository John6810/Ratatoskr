apiVersion: batch/v1
kind: Job
metadata:
  name: unit3d-migrate
spec:
  # Bounded retries and execution time. Keep the completed Job so restarted
  # application Pods can verify it; replace it explicitly before an upgrade.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unit3d-migrate
        ratatoskr.io/storage: unit3d
    spec:
      restartPolicy: Never
      # www-data is UID 33 in the dunglas/frankenphp Debian-based runtime;
      # the Dockerfile chowns /app/storage and /app/bootstrap/cache to
      # www-data and switches USER www-data before exposing ports.
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  ratatoskr.io/storage: unit3d
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      initContainers:
      - name: prepare-runtime
        image: ghcr.io/john6810/unit3d:v9.2.0
        command:
        - php
        - /opt/ratatoskr/lifecycle.php
        - prepare
        envFrom:
        - configMapRef:
            name: unit3d-config
        - secretRef:
            name: unit3d-secrets
        - secretRef:
            name: mariadb-secrets
        - secretRef:
            name: redis-secrets
        - secretRef:
            name: meilisearch-secrets
        env:
        - name: MEILISEARCH_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch-secrets
              key: MEILI_MASTER_KEY
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: lifecycle
          mountPath: /opt/ratatoskr
          readOnly: true
        - name: storage
          mountPath: /app/storage
      containers:
        - name: migrate
          image: ghcr.io/john6810/unit3d:v9.2.0
          imagePullPolicy: IfNotPresent
          # Seed only a new database; synchronize search settings on every run.
          command: ["php", "/opt/ratatoskr/lifecycle.php", "migrate"]
          envFrom:
            - configMapRef:
                name: unit3d-config
            - secretRef:
                name: unit3d-secrets
            - secretRef:
                name: mariadb-secrets
            - secretRef:
                name: redis-secrets
            - secretRef:
                name: meilisearch-secrets
          env:
            - name: MEILISEARCH_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-secrets
                  key: MEILI_MASTER_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: lifecycle
              mountPath: /opt/ratatoskr
              readOnly: true
            - name: storage
              mountPath: /app/storage
            # Laravel's compiled config and view caches live under
            # /app/bootstrap/cache. readOnlyRootFilesystem: true requires
            # this be a writable mount; emptyDir is fine since the cache
            # is regenerated on every Job invocation.
            - name: bootstrap-cache
              mountPath: /app/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: lifecycle
          configMap:
            name: unit3d-lifecycle
        - name: storage
          persistentVolumeClaim:
            claimName: unit3d-storage
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
