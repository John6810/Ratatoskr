apiVersion: v1
kind: ConfigMap
metadata:
  name: unit3d-config
# Non-sensitive UNIT3D / Laravel environment. Sensitive values (APP_KEY,
# DB_PASSWORD, REDIS_PASSWORD, MEILI_MASTER_KEY, DEFAULT_OWNER_PASSWORD,
# etc.) live in the per-component Secrets per ADR-0004's naming
# convention.
#
# This ConfigMap is shared across unit3d-migrate, unit3d-app,
# unit3d-queue, and unit3d-scheduler — it lives under unit3d-migrate/
# only because that component is the first to consume it; subsequent
# workload components reference the same ConfigMap by name without
# duplicating the data.
data:
  APP_ENV: production
  APP_DEBUG: "false"
  # APP_URL is overridden per overlay (dev keeps localhost, prod points
  # at the operator's tracker domain). Base ships a safe default that
  # makes a fresh deploy at least bootable.
  APP_URL: http://localhost
  LOG_CHANNEL: stack
  LOG_LEVEL: info

  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: unit3d
  DB_USERNAME: unit3d

  REDIS_HOST: redis
  REDIS_PORT: "6379"

  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  SESSION_LIFETIME: "120"

  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: redis

  MEILISEARCH_HOST: http://meilisearch:7700
  MEILI_ENV: production

  # VITE_ECHO_ADDRESS must be set even though UNIT3D v9.2.0 ships no
  # Reverb / WebSocket server (verified upstream and documented in
  # CLAUDE.md and CHANGELOG v0.2.0). Without it, parse_url() in the
  # bootstrap chain returns null and the app fails at boot. Overlays
  # patch the value to match the public URL when TLS is in front.
  VITE_ECHO_ADDRESS: http://localhost:8443
