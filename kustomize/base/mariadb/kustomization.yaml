apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Component-specific labels for mariadb. includeSelectors: false because
# selectors are immutable post-create — keeping selectors stable across
# label tweaks. The minimal selector (app.kubernetes.io/name: mariadb)
# is set explicitly in each manifest's spec.selector.
#
# Topology toggle (embedded StatefulSet vs external managed via
# ExternalName Service) per ADR-0001 lands as a Kustomize component
# under kustomize/components/external-mariadb/ in a later commit; this
# component carries the embedded path.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/component: database

resources:
  - statefulset.yaml
  - service.yaml
