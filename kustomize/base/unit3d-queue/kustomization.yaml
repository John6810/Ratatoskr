apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Component-specific labels for unit3d-queue. includeSelectors: false
# (selectors are immutable post-create); the minimal selector
# (app.kubernetes.io/name: unit3d-queue) is set explicitly in
# deployment.yaml's spec.selector and spec.template.metadata.labels.
#
# No service.yaml — queue workers are not addressed by HTTP. They pull
# jobs from Redis directly. No Service, no Ingress, no port exposure.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: unit3d-queue
      app.kubernetes.io/component: worker

resources:
  - deployment.yaml
