apiVersion: v1
kind: ServiceAccount
metadata:
  name: unit3d-migration-wait
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unit3d-migration-wait
rules:
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [unit3d-migrate]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unit3d-migration-wait
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unit3d-migration-wait
subjects:
  - kind: ServiceAccount
    name: unit3d-migration-wait
    namespace: unit3d
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unit3d-migration-api
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [app, worker, scheduler, bootstrap]
  policyTypes: [Egress]
  egress:
    # Replace with the API Service and control-plane endpoint CIDRs using
    # scripts/security/configure-api-egress.py before applying this render.
    - to:
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 16443
