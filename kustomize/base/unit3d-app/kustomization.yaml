apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Component-specific labels for unit3d-app. includeSelectors: false because
# selectors are immutable post-create; the minimal selector
# (app.kubernetes.io/name: unit3d-app) is set explicitly in deployment.yaml
# spec.selector and service.yaml spec.selector.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: unit3d-app
      app.kubernetes.io/component: app

# Generate unit3d-filesystems-config ConfigMap from the tracked PHP override
# at config/filesystems.php. The default suffix hash is enabled — every
# change to the .php file produces a new ConfigMap name (e.g.
# unit3d-filesystems-config-abc123def4), which Kustomize automatically
# rewrites into the Deployment's volumes.configMap.name. Result: a PHP
# override edit triggers a new ReplicaSet rollout (Recreate strategy at
# base/, RollingUpdate in prod-rwx).
configMapGenerator:
  - name: unit3d-filesystems-config
    files:
      - config/filesystems.php
    options:
      disableNameSuffixHash: false

resources:
  - deployment.yaml
  - service.yaml
