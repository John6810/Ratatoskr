apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Component-specific labels for unit3d-app. includeSelectors: false because
# selectors are immutable post-create; the minimal selector
# (app.kubernetes.io/name: unit3d-app) is set explicitly in deployment.yaml
# spec.selector and service.yaml spec.selector.
#
# The unit3d-filesystems-config ConfigMap (with suffix hash) is generated
# at the parent base/kustomization.yaml level so unit3d-app, unit3d-queue,
# and unit3d-scheduler all reference the same name and roll together when
# the PHP override changes.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: unit3d-app
      app.kubernetes.io/component: app

resources:
  - deployment.yaml
  - service.yaml
