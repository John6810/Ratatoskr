apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Component-specific labels for unit3d-scheduler. includeSelectors: false
# (selectors are immutable post-create); the minimal selector
# (app.kubernetes.io/name: unit3d-scheduler) is set explicitly in
# deployment.yaml.
#
# No service.yaml — the scheduler is fire-and-forget cron dispatch, no
# inbound traffic. No Service, no Ingress, no port exposure.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: unit3d-scheduler
      app.kubernetes.io/component: scheduler

resources:
  - deployment.yaml
