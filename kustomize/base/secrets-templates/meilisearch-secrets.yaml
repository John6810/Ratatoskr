# TEMPLATE — do not apply. See ./README.md for the kubeseal / ESO workflow.
#
# Meilisearch master key.
#
# Minimum 16 bytes per Meilisearch v1.x in production mode (MEILI_ENV=production
# enforces; the bundled service refuses to boot without a sufficiently
# long key). Recommend openssl rand -hex 32 → 64-char hex string, well
# above the floor.
apiVersion: v1
kind: Secret
metadata:
  name: meilisearch-secrets
  namespace: unit3d
type: Opaque
stringData:
  MEILI_MASTER_KEY: CHANGEME
