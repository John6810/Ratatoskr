# TEMPLATE — do not apply. See ./README.md for the kubeseal / ESO workflow.
#
# Application-level secrets for UNIT3D bootstrap.
#
# APP_KEY generation:
#   docker run --rm ghcr.io/john6810/unit3d:v9.2.0 php /app/artisan key:generate --show
# APP_KEY is generated ONCE per cluster and NEVER rotated (per ADR-0004).
# Rotation without an explicit re-encryption migration corrupts data
# silently — every encrypted column, every signed URL, every encrypted
# session cookie. v0.3 ships no rotation tooling; compromise is a manual
# incident procedure outside ratatoskr's automation.
#
# DEFAULT_OWNER_* feed the first-boot admin user via the unit3d-migrate
# Job's DatabaseSeeder (UserSeeder reads these env vars). Operator rotates
# the password via the UNIT3D admin UI on first login; name and email
# become the long-term admin record. The DEFAULT_OWNER_PASSWORD key may
# be deleted from this Secret post-bootstrap — ADR-0004 has an open
# VERIFY on whether UNIT3D v9.2.0 reads this on every boot or only on
# seed; confirm before deletion.
apiVersion: v1
kind: Secret
metadata:
  name: unit3d-secrets
  namespace: unit3d
type: Opaque
stringData:
  # Laravel encryption key. Format: base64:<44-char base64>. Generate
  # ONCE per cluster (see header comment). NEVER rotate.
  APP_KEY: CHANGEME

  # Bootstrap admin identity — set during the unit3d-migrate Job's seed
  # step. Real values; not placeholders.
  DEFAULT_OWNER_NAME: CHANGEME
  DEFAULT_OWNER_EMAIL: CHANGEME

  # First-boot only. Generate via: openssl rand -hex 32. Operator rotates
  # via the UNIT3D admin UI immediately after first login.
  DEFAULT_OWNER_PASSWORD: CHANGEME
