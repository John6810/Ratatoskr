#
# Redis password — MANDATORY in v0.3 prod per ADR-0004. The Compose stack
# already enforces this at compose/docker-compose.yml:37-38 via
# `redis-server --requirepass ${REDIS_PASSWORD:?}` (the `:?` syntax
# fails fast if unset). NetworkPolicy is defense-in-depth, never a
# replacement for auth.
#
# Generation: openssl rand -hex 32 (64-char hex, 256 bits of entropy).
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: unit3d
type: Opaque
stringData:
  REDIS_PASSWORD: CHANGEME
