# TEMPLATE — do not apply. See ./README.md for the kubeseal / ESO workflow.
#
# S3 connection details for the three Storage-aware disks (torrent-files,
# subtitle-files, attachment-files) per ADR-0002. Each disk takes 6 keys:
# KEY, SECRET, REGION, BUCKET, ENDPOINT, USE_PATH_STYLE_ENDPOINT — totalling
# 18 keys for the full S3 routing.
#
# All 18 keys are required if the prod overlay routes the disk to s3 (set
# FILESYSTEM_<DISK>=s3 in the unit3d-config ConfigMap, e.g. the prod-rwx
# overlay does this for all three disks). They are ignored otherwise — the
# env() guards in config/filesystems.php fall back to 'local' driver and
# never read the connection details. The Secret in the unit3d-app
# Deployment is marked `optional: true` so a missing Secret does not block
# pod start in dev / staging / prod-rwo.
#
# The disk env-driver toggles (FILESYSTEM_TORRENT_FILES,
# FILESYSTEM_SUBTITLE_FILES, FILESYSTEM_ATTACHMENT_FILES) live in the
# unit3d-config ConfigMap, not here — this Secret carries only the cloud
# credentials. Splitting toggle from credential keeps non-sensitive routing
# decisions in plain ConfigMaps.
#
# USE_PATH_STYLE_ENDPOINT is a boolean string: "true" for MinIO and some
# Cloudflare R2 configurations (path-style URLs), "false" for AWS S3 and
# Backblaze B2 (virtual-hosted-style URLs). Every disk independently
# chooses; mixing providers across disks is supported.
apiVersion: v1
kind: Secret
metadata:
  name: unit3d-storage-secrets
  namespace: unit3d
type: Opaque
stringData:
  # torrent-files — heaviest disk on a populated tracker. .torrent files
  # commonly run tens to hundreds of MB each, gigabytes for large media
  # releases. Per ADR-0002 this is the dominant beneficiary of S3 routing
  # (PVC sizing collapses an order of magnitude vs pure-PVC).
  FILESYSTEM_TORRENT_FILES_KEY: CHANGEME
  FILESYSTEM_TORRENT_FILES_SECRET: CHANGEME
  FILESYSTEM_TORRENT_FILES_REGION: CHANGEME
  FILESYSTEM_TORRENT_FILES_BUCKET: CHANGEME
  FILESYSTEM_TORRENT_FILES_ENDPOINT: CHANGEME
  FILESYSTEM_TORRENT_FILES_USE_PATH_STYLE_ENDPOINT: CHANGEME

  # subtitle-files — small text files (.srt, .vtt). Same backend as
  # torrent-files is conventional but not required; operators with cost
  # asymmetry across providers can split.
  FILESYSTEM_SUBTITLE_FILES_KEY: CHANGEME
  FILESYSTEM_SUBTITLE_FILES_SECRET: CHANGEME
  FILESYSTEM_SUBTITLE_FILES_REGION: CHANGEME
  FILESYSTEM_SUBTITLE_FILES_BUCKET: CHANGEME
  FILESYSTEM_SUBTITLE_FILES_ENDPOINT: CHANGEME
  FILESYSTEM_SUBTITLE_FILES_USE_PATH_STYLE_ENDPOINT: CHANGEME

  # attachment-files — forum attachments (PDFs, images, etc.) uploaded via
  # the Livewire AttachmentUpload component (verified Storage-aware in the
  # ADR-0002 disk inventory).
  FILESYSTEM_ATTACHMENT_FILES_KEY: CHANGEME
  FILESYSTEM_ATTACHMENT_FILES_SECRET: CHANGEME
  FILESYSTEM_ATTACHMENT_FILES_REGION: CHANGEME
  FILESYSTEM_ATTACHMENT_FILES_BUCKET: CHANGEME
  FILESYSTEM_ATTACHMENT_FILES_ENDPOINT: CHANGEME
  FILESYSTEM_ATTACHMENT_FILES_USE_PATH_STYLE_ENDPOINT: CHANGEME
