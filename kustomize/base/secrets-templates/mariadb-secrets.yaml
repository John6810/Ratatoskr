# TEMPLATE — do not apply. See ./README.md for the kubeseal / ESO workflow.
#
# MariaDB credentials.
#
# Generation: each value is a random hex string. openssl rand -hex 32
# yields 64 chars (256 bits of entropy), well above MariaDB's effective
# password strength ceiling.
#
# MARIADB_ROOT_PASSWORD is PERMANENT (per ADR-0004). The high-privilege
# admin credential is retained for the lifetime of the deployment for
# schema repairs, manual mariadbd ops, and support of last resort. Not
# deleted post-bootstrap. Treat with respect: never expose beyond the
# cluster Secret + RBAC; never log; never embed in CI.
#
# DB_PASSWORD is the unit3d application user password. UNIT3D's Eloquent
# connection uses this; unit3d-migrate, unit3d-app, unit3d-queue, and
# unit3d-scheduler all consume it via envFrom. Rotation is possible with
# a coordinated MariaDB GRANT update + app pod restart (operator
# procedure, not automated at v0.3).
#
# MARIADB_BACKUP_PASSWORD is the dedicated backup user password
# (consumed by the v0.2 ratatoskr-backup pipeline). The manual GRANT
# step documented in docs/backup-restore.md must use this exact value
# when the operator provisions the backup user post-MariaDB bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secrets
  namespace: unit3d
type: Opaque
stringData:
  # Permanent admin credential. Generate via: openssl rand -hex 32.
  MARIADB_ROOT_PASSWORD: CHANGEME

  # Application user password (unit3d). Same generation. Rotation
  # possible with coordinated app restart.
  DB_PASSWORD: CHANGEME

  # Backup user password. Same generation. Used by the manual GRANT
  # step from docs/backup-restore.md and consumed by ratatoskr-backup.
  MARIADB_BACKUP_PASSWORD: CHANGEME
