apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
spec:
  template:
    spec:
      containers:
        - name: meilisearch
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
