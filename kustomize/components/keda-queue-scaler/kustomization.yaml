apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# NOTE: no `labels:` block here. A Component's transformations propagate
# to every resource in the parent kustomization (base + overlay), so a
# labels block would overwrite the per-component labels on mariadb,
# redis, meilisearch, unit3d-* in the parent's render — same gotcha
# documented in components/bootstrap-app-key/kustomization.yaml and
# components/ingress-traefik/kustomization.yaml. Per-resource labels
# are inlined directly on each YAML.

resources:
  - scaledobject-queue.yaml
  - triggerauthentication.yaml
