apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unit3d-bootstrap-app-key
  labels:
    app.kubernetes.io/name: bootstrap-app-key
    app.kubernetes.io/component: bootstrap
# Minimum RBAC: the bootstrap Job reads APP_KEY from unit3d-secrets to
# decide whether to no-op, then patches APP_KEY on the same Secret if
# absent. resourceNames pins the access to that one Secret only — no
# wildcard on secrets/* in the namespace.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["unit3d-secrets"]
    verbs: ["get", "patch"]
