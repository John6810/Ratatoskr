# Generate once without booting Laravel or writing shared files.
apiVersion: batch/v1
kind: Job
metadata:
  name: unit3d-bootstrap-app-key
  labels:
    app.kubernetes.io/name: bootstrap-app-key
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-app-key
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: unit3d-bootstrap-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap-key
        image: ghcr.io/john6810/unit3d:v9.2.0
        imagePullPolicy: IfNotPresent
        command:
        - php
        - -r
        args:
        - '$dir = "/var/run/secrets/kubernetes.io/serviceaccount";

          $token = trim(file_get_contents("$dir/token"));

          $ns = trim(file_get_contents("$dir/namespace"));

          $host = getenv("KUBERNETES_SERVICE_HOST");

          if (str_contains($host, ":")) { $host = "[$host]"; }

          $url = "https://$host:".(getenv("KUBERNETES_SERVICE_PORT_HTTPS") ?: "443")."/api/v1/namespaces/$ns/secrets/unit3d-secrets";

          $base = ["http" => ["timeout" => 10, "header" => "Authorization: Bearer $token"], "ssl" => ["cafile" => "$dir/ca.crt", "verify_peer" => true, "verify_peer_name" => true]];

          $body = file_get_contents($url, false, stream_context_create($base));

          if ($body === false) { exit(1); }

          $secret = json_decode($body, true, 512, JSON_THROW_ON_ERROR);

          $key = base64_decode($secret["data"]["APP_KEY"] ?? "", true);

          if ($key !== false && $key !== "" && $key !== "CHANGEME") { echo "APP_KEY already present; unchanged\n"; exit(0); }

          $base["http"]["method"] = "PATCH";

          $base["http"]["header"] .= "\r\nContent-Type: application/merge-patch+json";

          $base["http"]["content"] = json_encode(["metadata" => ["resourceVersion" => $secret["metadata"]["resourceVersion"]], "data" => ["APP_KEY" => base64_encode("base64:".base64_encode(random_bytes(32)))]]);

          if (file_get_contents($url, false, stream_context_create($base)) === false) { exit(1); }

          echo "APP_KEY initialized\n";

          '
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
