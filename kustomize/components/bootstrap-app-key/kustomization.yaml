apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# NOTE: no `labels:` block here. A Component's transformations propagate
# to every resource in the parent kustomization (base + overlay), so a
# labels block would overwrite the per-component labels on mariadb,
# redis, meilisearch, unit3d-* in the parent's render. Per-resource
# labels are inlined directly on serviceaccount.yaml, role.yaml,
# rolebinding.yaml, and job.yaml instead.

resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - job.yaml
