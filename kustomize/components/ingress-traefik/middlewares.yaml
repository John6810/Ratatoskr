# Traefik Middlewares applied to Route 2 (catch-all) of the IngressRoute.
# Both are intentionally NOT applied to Route 1 (/announce) — bencoded
# responses and BitTorrent client compatibility require zero rewrite,
# zero redirect, no compression on /announce per ADR-0003 and
# .claude/rules/k8s.md /announce traffic rules.
#
# Operators wanting auth-endpoint-specific rate limits (tighter on
# /login, /register, /api/* than on browsing) can add a third Route in
# their overlay's IngressRoute patch with PathPrefix matching and a
# stricter Middleware. v0.3 ships a permissive general rate limit only.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unit3d-rate-limit
  labels:
    app.kubernetes.io/name: unit3d-app
    app.kubernetes.io/component: app
spec:
  rateLimit:
    # 30 requests/second average per source IP, 60 burst. Permissive
    # enough for normal browsing and torrent client UI traffic; brutal
    # enough to slow down credential stuffing and scraping. Operators
    # tighten or relax in their overlay.
    average: 30
    period: 1s
    burst: 60
    sourceCriterion:
      ipStrategy:
        # Trust the X-Forwarded-For chain from the ingress controller's
        # pod CIDR. depth: 1 means use the rightmost forwarded IP (the
        # pod that called us); operators behind multi-hop ingress (CDN +
        # ingress controller) increase depth in their overlay.
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unit3d-security-headers
  labels:
    app.kubernetes.io/name: unit3d-app
    app.kubernetes.io/component: app
spec:
  headers:
    # Standard security headers — none of these touch the response body
    # and so are safe even if Traefik ever applied this Middleware to
    # /announce by accident (which the IngressRoute structurally
    # prevents).
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    # HSTS — uncomment if INGRESS_TLS=letsencrypt mode (no upstream LB
    # sets HSTS). Leave commented if INGRESS_TLS=external (the upstream
    # LB sets HSTS already — double-set is bad: conflicting values
    # confuse browsers; max-age races between layers can lock users
    # out of the site for the longer of the two windows).
    # stsSeconds: 31536000
    # stsIncludeSubdomains: true
    # stsPreload: true
