name: docker-build

# Triggers:
#   - push to main: builds + pushes :main, signs the digest
#   - push of tag v*: builds + pushes :vX.Y.Z, :X.Y, :latest, signs
#   - pull_request to main: builds + scans only (no push, no sign)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Default-deny at the top level — every job opts in to what it needs.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/john6810/unit3d

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read       # checkout
      packages: write      # push to ghcr.io
      id-token: write      # OIDC token for cosign keyless signing

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract UNIT3D_VERSION from Dockerfile
        id: unit3d
        run: |
          version=$(grep -oE 'ARG UNIT3D_VERSION=\S+' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved UNIT3D_VERSION=${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        # Skip on PR — fork PRs only have a read-only GITHUB_TOKEN, login would
        # fail. Branch PRs from the same repo could log in but we never push
        # from a PR build, so logging in serves no purpose.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # Tag plan:
          #   push to main          -> :main
          #   PR (build only)       -> :pr-<num>
          #   tag v0.2.0            -> :v0.2.0, :0.2, :latest (via flavor)
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      # First build: amd64 only, loaded into the local Docker daemon so Trivy
      # can scan it. Multi-platform builds cannot be `--load`ed; we run a
      # second multi-arch build below that hits the same gha cache and is
      # therefore near-free. Splitting like this lets Trivy gate the push.
      - name: Build for scan (linux/amd64, load locally)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ratatoskr-scan:${{ github.sha }}
          build-args: |
            UNIT3D_VERSION=${{ steps.unit3d.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ratatoskr-scan:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          format: table

      # Multi-arch build + push. PR runs build only (push=false) — same cache,
      # validates the arm64 build path without publishing.
      - name: Build & push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UNIT3D_VERSION=${{ steps.unit3d.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      # Keyless OIDC signing. The signature is bound to the manifest digest,
      # which is shared across every tag pushed in the prior step — one
      # cosign call covers them all.
      - name: Sign image manifest (cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
