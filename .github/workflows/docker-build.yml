name: docker-build

# Triggers:
#   - push to main:    builds + pushes :main, signs the digest
#   - push of tag v*:  builds + pushes the per-image tag plan, signs
#   - pull_request:    builds + scans only (no push, no sign)
#
# Two images are built in parallel via a strategy matrix:
#   ghcr.io/john6810/unit3d            UNIT3D on FrankenPHP
#   ghcr.io/john6810/ratatoskr-backup  mariadb-backup + restic
#
# Tag plans differ deliberately:
#   unit3d   : driven by Dockerfile ARG UNIT3D_VERSION (decoupled from
#              ratatoskr git tag). On any push: :v9.2.0, :9.2, :9. On a
#              git tag v* push: also :ratatoskr-v0.2.0 alias for traceability.
#              No :latest — the image version is driven by the ARG, not the
#              git ref, so :latest would re-point to the same image on every
#              ratatoskr release without an UNIT3D bump.
#   backup   : 1:1 with ratatoskr git tag. On a git tag v0.2.0 push:
#              :v0.2.0, :0.2, :0, :latest. Backup tooling and ratatoskr
#              release evolve in lockstep, so :latest stays meaningful.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Default-deny at the top level — every job opts in to what it needs.
permissions:
  contents: read

jobs:
  # Extract pinned versions from the Dockerfiles in one place. Outputs are
  # consumed by the matrix to compute image tags and build-args.
  versions:
    runs-on: ubuntu-latest
    outputs:
      unit3d:       ${{ steps.extract.outputs.unit3d }}
      unit3d_minor: ${{ steps.extract.outputs.unit3d_minor }}
      unit3d_major: ${{ steps.extract.outputs.unit3d_major }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract versions from Dockerfiles
        id: extract
        run: |
          full=$(grep -oE 'ARG UNIT3D_VERSION=\S+' docker/Dockerfile | head -1 | cut -d= -f2-)
          # full = "v9.2.0" -> derive minor (9.2) and major (9) floating aliases.
          stripped=${full#v}
          minor=${stripped%.*}
          major=${stripped%%.*}
          {
            echo "unit3d=${full}"
            echo "unit3d_minor=${minor}"
            echo "unit3d_major=${major}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved UNIT3D_VERSION=${full} (minor=${minor} major=${major})"
          # MARIADB_VERSION is intentionally NOT extracted: the backup
          # Dockerfile's ARG default is the single source of truth, and the
          # workflow lets the build use that default. Bumping MariaDB is a
          # Dockerfile-only change with no workflow churn.

  build:
    needs: versions
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest

    permissions:
      contents: read       # checkout
      packages: write      # push to ghcr.io
      id-token: write      # OIDC token for cosign keyless signing

    # fail-fast: false so a Trivy or build failure on one cell does not abort
    # the other — we still want to know whether the sibling image is healthy.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit3d
            image: ghcr.io/john6810/unit3d
            dockerfile: docker/Dockerfile
            build_args: |
              UNIT3D_VERSION=${{ needs.versions.outputs.unit3d }}
            tags: |
              type=raw,value=${{ needs.versions.outputs.unit3d }}
              type=raw,value=${{ needs.versions.outputs.unit3d_minor }}
              type=raw,value=${{ needs.versions.outputs.unit3d_major }}
              type=raw,value=ratatoskr-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
              type=ref,event=branch
              type=ref,event=pr
            flavor: |
              latest=false

          - name: backup
            image: ghcr.io/john6810/ratatoskr-backup
            dockerfile: docker/backup/Dockerfile
            # No build_args: the backup Dockerfile's ARG MARIADB_VERSION
            # default (11.8) is the source of truth.
            build_args: ''
            # `pattern=v{{version}}` not `{{version}}` — node-semver strips
            # the v prefix when parsing the source git tag, so without the
            # explicit `v` in the pattern the published tag would be :0.2.0
            # not :v0.2.0. The major and minor floats stay v-less on purpose
            # (operators pin :0.2 / :0, not :v0.2 / :v0).
            tags: |
              type=semver,pattern=v{{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
              type=ref,event=branch
              type=ref,event=pr
            flavor: |
              latest=auto

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        # Skip on PR — fork PRs only have a read-only GITHUB_TOKEN, login
        # would fail. Same-repo PRs could log in but never push, so logging
        # in serves no purpose.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ matrix.image }}
          tags: ${{ matrix.tags }}
          flavor: ${{ matrix.flavor }}

      # First build: amd64 only, loaded into the local Docker daemon so Trivy
      # can scan it. Multi-platform builds cannot be `--load`ed; the second
      # multi-arch build below hits the same gha cache and is therefore
      # near-free. Splitting like this lets Trivy gate the push per cell.
      - name: Build for scan (linux/amd64, load locally)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ratatoskr-scan:${{ matrix.name }}-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          # Cache scope per cell — unit3d and backup share no useful layers
          # and would only contend on a single shared scope.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy vulnerability scan (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ratatoskr-scan:${{ matrix.name }}-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          format: table

      # Multi-arch build + push. PR runs build only (push=false) — same
      # cache, validates the arm64 build path without publishing.
      - name: Build & push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless OIDC signing. The signature is bound to the manifest digest,
      # which is shared across every tag pushed in the prior step for this
      # cell — one cosign call covers them all.
      - name: Sign image manifest (cosign keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
