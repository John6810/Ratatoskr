name: docker-build

# Triggers:
#   - push to main:    builds + pushes :main, signs the digest
#   - push of tag v*:  builds + pushes the per-image tag plan, signs
#   - pull_request:    builds + scans only (no push, no sign)
#
# Six images are qualified on native amd64 and arm64 runners: application,
# migration, backup, MariaDB, Redis and MeiliSearch. Main/tag publication
# requires both image scans and the deployment/recovery qualification.
#
# Tag plans differ deliberately:
#   unit3d   : driven by Dockerfile ARG UNIT3D_VERSION (decoupled from
#              ratatoskr git tag). On any push: :v9.2.0, :9.2, :9. On a
#              git tag v* push: also :ratatoskr-v0.2.0 alias for traceability.
#              No :latest — the image version is driven by the ARG, not the
#              git ref, so :latest would re-point to the same image on every
#              ratatoskr release without an UNIT3D bump.
#   backup   : 1:1 with ratatoskr git tag. On a git tag v0.2.0 push:
#              :v0.2.0, :0.2, :0, :latest. Backup tooling and ratatoskr
#              release evolve in lockstep, so :latest stays meaningful.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Default-deny at the top level — every job opts in to what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Extract pinned versions from the Dockerfiles in one place. Outputs are
  # consumed by the matrix to compute image tags and build-args.
  versions:
    runs-on: ubuntu-latest
    outputs:
      unit3d:       ${{ steps.extract.outputs.unit3d }}
      unit3d_minor: ${{ steps.extract.outputs.unit3d_minor }}
      unit3d_major: ${{ steps.extract.outputs.unit3d_major }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract versions from Dockerfiles
        id: extract
        run: |
          full=$(grep -oE 'ARG UNIT3D_VERSION=\S+' docker/Dockerfile | head -1 | cut -d= -f2-)
          # full = "v9.2.0" -> derive minor (9.2) and major (9) floating aliases.
          stripped=${full#v}
          minor=${stripped%.*}
          major=${stripped%%.*}
          {
            echo "unit3d=${full}"
            echo "unit3d_minor=${minor}"
            echo "unit3d_major=${major}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved UNIT3D_VERSION=${full} (minor=${minor} major=${major})"
          # MARIADB_VERSION is intentionally NOT extracted: the backup
          # Dockerfile's ARG default is the single source of truth, and the
          # workflow lets the build use that default. Bumping MariaDB is a
          # Dockerfile-only change with no workflow churn.

  build:
    needs: versions
    name: build (${{ matrix.name }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: unit3d, arch: amd64, runner: ubuntu-latest, dockerfile: docker/Dockerfile}
          - {name: unit3d, arch: arm64, runner: ubuntu-24.04-arm, dockerfile: docker/Dockerfile}
          - {name: unit3d-migrate, arch: amd64, runner: ubuntu-latest, dockerfile: docker/Dockerfile, target: migration}
          - {name: unit3d-migrate, arch: arm64, runner: ubuntu-24.04-arm, dockerfile: docker/Dockerfile, target: migration}
          - {name: backup, arch: amd64, runner: ubuntu-latest, dockerfile: docker/backup/Dockerfile}
          - {name: backup, arch: arm64, runner: ubuntu-24.04-arm, dockerfile: docker/backup/Dockerfile}
          - {name: mariadb, arch: amd64, runner: ubuntu-latest, dockerfile: docker/dependencies/Dockerfile, target: mariadb}
          - {name: mariadb, arch: arm64, runner: ubuntu-24.04-arm, dockerfile: docker/dependencies/Dockerfile, target: mariadb}
          - {name: redis, arch: amd64, runner: ubuntu-latest, dockerfile: docker/dependencies/Dockerfile, target: redis}
          - {name: redis, arch: arm64, runner: ubuntu-24.04-arm, dockerfile: docker/dependencies/Dockerfile, target: redis}
          - {name: meilisearch, arch: amd64, runner: ubuntu-latest, dockerfile: docker/dependencies/Dockerfile, target: meilisearch}
          - {name: meilisearch, arch: arm64, runner: ubuntu-24.04-arm, dockerfile: docker/dependencies/Dockerfile, target: meilisearch}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build native image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || 'runtime' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ratatoskr-scan:${{ matrix.name }}-${{ matrix.arch }}-${{ github.sha }}
          build-args: UNIT3D_VERSION=${{ needs.versions.outputs.unit3d }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          # A fresh OS package resolution on every run avoids stale apt layers.
          no-cache-filters: ${{ startsWith(matrix.name, 'unit3d') && 'runtime-base,php-toolchain' || matrix.target || 'runtime' }}
      - name: Verify native runtime
        env:
          IMAGE: ratatoskr-scan:${{ matrix.name }}-${{ matrix.arch }}-${{ github.sha }}
          ARCH: ${{ matrix.arch }}
          COMPONENT: ${{ matrix.name }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "$ARCH"
          if [ "$COMPONENT" = unit3d ]; then
            docker run --rm --entrypoint php "$IMAGE" --version
            docker run --rm --entrypoint frankenphp "$IMAGE" version
            IMAGE="$IMAGE" bash scripts/tests/image-security.sh
          elif [ "$COMPONENT" = unit3d-migrate ]; then
            docker run --rm --entrypoint php "$IMAGE" --version
            docker run --rm --entrypoint mariadb "$IMAGE" --version
          elif [ "$COMPONENT" = backup ]; then
            docker run --rm --entrypoint restic "$IMAGE" version
          elif [ "$COMPONENT" = mariadb ]; then
            docker run --rm --entrypoint mariadbd "$IMAGE" --version
            docker run --rm --entrypoint gosu "$IMAGE" mysql id
          elif [ "$COMPONENT" = redis ]; then
            docker run --rm --entrypoint redis-server "$IMAGE" --version
          else
            docker run --rm --entrypoint /bin/meilisearch "$IMAGE" --version
          fi
      - name: Full vulnerability inventory (including unfixed and UNKNOWN)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ratatoskr-scan:${{ matrix.name }}-${{ matrix.arch }}-${{ github.sha }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          format: json
          output: trivy.json
      - name: Reject every vulnerability with an available fix
        run: python3 scripts/security/check-image.py trivy.json
      - name: Retain full vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerabilities-${{ matrix.name }}-${{ matrix.arch }}
          path: trivy.json
          if-no-files-found: error
          retention-days: 30

  qualification:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/validate.yml

  publish:
    if: github.event_name != 'pull_request'
    needs: [versions, build, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit3d
            image: ghcr.io/john6810/unit3d
            dockerfile: docker/Dockerfile
            build_args: |
              UNIT3D_VERSION=${{ needs.versions.outputs.unit3d }}
            tags: |
              type=raw,value=${{ needs.versions.outputs.unit3d }}
              type=raw,value=${{ needs.versions.outputs.unit3d_minor }}
              type=raw,value=${{ needs.versions.outputs.unit3d_major }}
              type=raw,value=ratatoskr-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
              type=sha,format=long
              type=ref,event=branch
              type=ref,event=pr
            flavor: |
              latest=false

          - name: unit3d-migrate
            image: ghcr.io/john6810/unit3d-migrate
            dockerfile: docker/Dockerfile
            target: migration
            build_args: |
              UNIT3D_VERSION=${{ needs.versions.outputs.unit3d }}
            tags: |
              type=raw,value=${{ needs.versions.outputs.unit3d }}
              type=sha,format=long
            flavor: |
              latest=false

          - name: backup
            image: ghcr.io/john6810/ratatoskr-backup
            dockerfile: docker/backup/Dockerfile
            # No build_args: the backup Dockerfile's ARG MARIADB_VERSION
            # default (11.8) is the source of truth.
            build_args: ''
            # `pattern=v{{version}}` not `{{version}}` — node-semver strips
            # the v prefix when parsing the source git tag, so without the
            # explicit `v` in the pattern the published tag would be :0.2.0
            # not :v0.2.0. The major and minor floats stay v-less on purpose
            # (operators pin :0.2 / :0, not :v0.2 / :v0).
            tags: |
              type=semver,pattern=v{{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
              type=sha,format=long
              type=ref,event=branch
              type=ref,event=pr
            flavor: |
              latest=auto
          - name: mariadb
            image: ghcr.io/john6810/ratatoskr-mariadb
            dockerfile: docker/dependencies/Dockerfile
            target: mariadb
            build_args: ''
            tags: |
              type=raw,value=security-20261010
              type=sha,format=long
            flavor: |
              latest=false
          - name: redis
            image: ghcr.io/john6810/ratatoskr-redis
            dockerfile: docker/dependencies/Dockerfile
            target: redis
            build_args: ''
            tags: |
              type=raw,value=security-20261010
              type=sha,format=long
            flavor: |
              latest=false
          - name: meilisearch
            image: ghcr.io/john6810/ratatoskr-meilisearch
            dockerfile: docker/dependencies/Dockerfile
            target: meilisearch
            build_args: ''
            tags: |
              type=raw,value=security-20261010
              type=sha,format=long
            flavor: |
              latest=false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ matrix.image }}
          tags: ${{ matrix.tags }}
          flavor: ${{ matrix.flavor }}

      - name: Build & push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || 'runtime' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.name }}-amd64
            type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      # Keyless OIDC signing. The signature is bound to the manifest digest,
      # which is shared across every tag pushed in the prior step for this
      # cell — one cosign call covers them all.
      - name: Sign image manifest (cosign keyless)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
