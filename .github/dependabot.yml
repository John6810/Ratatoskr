version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    assignees:
      - "John6810"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # One PR per week with every action bump rolled in. Dependabot updates
    # the pinned commit SHA and refreshes the trailing "# vX.Y.Z" comment.
    groups:
      github-actions:
        patterns:
          - "*"
