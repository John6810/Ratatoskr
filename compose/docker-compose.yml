# ratatoskr — UNIT3D Community Edition Compose stack.
#
# Single-host, production-shaped local deployment. For multi-node K8s, see
# ../kustomize/ or ../helm/. Build context is the repo root (one level up)
# because the Dockerfile copies docker/Caddyfile from there.
#
# See README.md for the 5-step quickstart.

name: ratatoskr

x-no-database-admin: &no-database-admin
  MARIADB_ROOT_PASSWORD: ""
  MARIADB_BACKUP_PASSWORD: ""

x-application-security: &application-security
  environment:
    <<: *no-database-admin
    DEFAULT_OWNER_PASSWORD: ""
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    - /app/bootstrap/cache:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0770
    - /data/caddy:rw,noexec,nosuid,nodev,size=32m,uid=33,gid=33,mode=0700
    - /config/caddy:rw,noexec,nosuid,nodev,size=16m,uid=33,gid=33,mode=0700
  networks: [application, backend]

services:
  mariadb:
    image: ghcr.io/john6810/ratatoskr-mariadb:security-20261010
    build:
      context: ..
      dockerfile: docker/dependencies/Dockerfile
      target: mariadb
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Only the initial volume setup / drop to mysql needs these capabilities.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    read_only: true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /run/mysqld:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0755
    networks: [backend]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: ${DB_DATABASE:?}
      MARIADB_USER: ${DB_USERNAME:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - mariadb-data:/var/lib/mysql
    # healthcheck.sh ships in the official MariaDB image since 10.11.
    # --innodb_initialized waits for InnoDB recovery, which is what we
    # actually need before letting Laravel migrate run.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ghcr.io/john6810/ratatoskr-redis:security-20261010
    build:
      context: ..
      dockerfile: docker/dependencies/Dockerfile
      target: redis
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    read_only: true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks: [backend]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  meilisearch:
    image: ghcr.io/john6810/ratatoskr-meilisearch:security-20261010
    build:
      context: ..
      dockerfile: docker/dependencies/Dockerfile
      target: meilisearch
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    networks: [backend]
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot migration + seed + Meili index settings push. Runs DatabaseSeeder
  # (UserSeeder creates the bootstrap admin from DEFAULT_OWNER_*) and then
  # `scout:sync-index-settings`, which pushes the filterableAttributes /
  # sortableAttributes / etc. blocks declared in config/scout.php to
  # MeiliSearch (Torrent + Person indexes in v9.2.0). Without that push,
  # Meili's `torrents` index has no filterable attributes and the `status`
  # filter that drives /torrents returns 500. The lifecycle wrapper seeds
  # only a new database: several upstream seeders insert fixed primary keys.
  # Existing databases only run migrations and search-settings synchronization.
  #
  # `scout:import` is intentionally NOT chained here. On a populated tracker
  # it re-imports every row in 500-batch chunks (hours on real data) on every
  # restart, blocking unit3d / scheduler / queue via service_completed_successfully.
  # Ongoing drift is handled by UNIT3D's auto:sync_torrents_to_meilisearch
  # scheduled command (every 15 min, delta-only) inside unit3d-scheduler.
  # See compose/README.md for the manual backfill recipe.
  unit3d-migrate:
    <<: *application-security
    environment: *no-database-admin
    image: ratatoskr/unit3d-migrate:${UNIT3D_VERSION:-v9.2.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migration
      args:
        UNIT3D_VERSION: ${UNIT3D_VERSION:-v9.2.0}
    restart: "no"
    env_file: .env
    entrypoint: ["php", "/usr/local/lib/ratatoskr/lifecycle.php"]
    command: ["migrate"]
    volumes:
      - unit3d-storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  unit3d:
    <<: *application-security
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    image: ratatoskr/unit3d:${UNIT3D_VERSION:-v9.2.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        UNIT3D_VERSION: ${UNIT3D_VERSION:-v9.2.0}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${UNIT3D_PORT:-8080}:80"
    volumes:
      - unit3d-storage:/app/storage
    depends_on:
      unit3d-migrate:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # UNIT3D v9.2.0 has no native /health endpoint. Probing / returns 200
    # or 302 (unauthenticated redirect to /login); curl -f accepts both.
    # 60s start_period covers FrankenPHP worker warm-up.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  unit3d-scheduler:
    <<: *application-security
    image: ratatoskr/unit3d:${UNIT3D_VERSION:-v9.2.0}
    restart: unless-stopped
    env_file: .env
    entrypoint: ["php", "/app/artisan"]
    # schedule:work is the long-running scheduler (Laravel 10+); sleeps
    # until the next minute and dispatches due tasks. No cron sidecar.
    command: ["schedule:work"]
    volumes:
      - unit3d-storage:/app/storage
    depends_on:
      unit3d-migrate:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Workers don't expose HTTP. `artisan --version` exercises PHP +
    # autoloader + app bootstrap — fails fast if the image is broken.
    # If the worker process crashes, restart: unless-stopped recovers it.
    healthcheck:
      test: ["CMD-SHELL", "php /app/artisan --version >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  unit3d-queue:
    <<: *application-security
    image: ratatoskr/unit3d:${UNIT3D_VERSION:-v9.2.0}
    restart: unless-stopped
    env_file: .env
    entrypoint: ["php", "/app/artisan"]
    command:
      - queue:work
      - --tries=3
      - --max-time=3600
      - --sleep=3
    volumes:
      - unit3d-storage:/app/storage
    depends_on:
      unit3d-migrate:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php /app/artisan --version >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  application: {}
  # Infrastructure has no published ports or direct route to the internet.
  backend:
    internal: true

volumes:
  mariadb-data:
  redis-data:
  meilisearch-data:
  unit3d-storage:
