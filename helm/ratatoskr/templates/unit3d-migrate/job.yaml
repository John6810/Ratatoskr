{{- if .Values.migrate.enabled }}
{{- $component := "migration" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ratatoskr.migrate.fullname" . }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    app.kubernetes.io/name: unit3d-migrate
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.timeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "ratatoskr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        app.kubernetes.io/name: unit3d-migrate
        ratatoskr.io/storage: {{ include "ratatoskr.fullname" . | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "ratatoskr.storageAffinity" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.unit3d.podSecurityContext | nindent 8 }}
      initContainers:
        - name: prepare-runtime
          image: {{ include "ratatoskr.unit3d.image" . | quote }}
          imagePullPolicy: {{ .Values.unit3d.image.pullPolicy }}
          command: ["php", "/opt/ratatoskr/lifecycle.php", "prepare"]
          envFrom:
            {{- include "ratatoskr.unit3d.envFrom" . | nindent 12 }}
          env:
            {{- include "ratatoskr.unit3d.env" . | nindent 12 }}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            {{- toYaml .Values.unit3d.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: lifecycle
              mountPath: /opt/ratatoskr
              readOnly: true
            - name: storage
              mountPath: /app/storage
      containers:
        - name: migrate
          image: {{ include "ratatoskr.migrate.image" . | quote }}
          imagePullPolicy: {{ .Values.unit3d.image.pullPolicy | default "IfNotPresent" }}
          # Seed only a new database; synchronize search settings on every run.
          command: ["php", "/opt/ratatoskr/lifecycle.php", "migrate"]
          envFrom:
            {{- include "ratatoskr.unit3d.envFrom" . | nindent 12 }}
          env:
            {{- include "ratatoskr.unit3d.env" . | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            {{- toYaml .Values.unit3d.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: lifecycle
              mountPath: /opt/ratatoskr
              readOnly: true
            # Mount filesystems.php override for symmetry with the
            # other UNIT3D workloads. Seed data is DB-only at v9.2.0
            # (no filesystem writes from seeders), but mounting the
            # override keeps the migrate Job's filesystem view
            # consistent if a future migration writes files.
            - name: filesystems-config
              mountPath: /app/config/filesystems.php
              subPath: filesystems.php
              readOnly: true
            {{- if .Values.storage.enabled }}
            - name: storage
              mountPath: /app/storage
            {{- end }}
            - name: bootstrap-cache
              mountPath: /app/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: lifecycle
          configMap:
            name: {{ include "ratatoskr.fullname" . }}-lifecycle
        - name: filesystems-config
          configMap:
            name: {{ include "ratatoskr.fullname" . }}-unit3d-filesystems-config
        {{- if .Values.storage.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "ratatoskr.fullname" . }}-unit3d-storage
        {{- end }}
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
