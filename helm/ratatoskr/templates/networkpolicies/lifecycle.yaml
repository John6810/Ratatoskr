{{- if .Values.networkPolicies.enabled }}
{{- if .Values.migrate.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ratatoskr.fullname" . }}-migration-api
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      ratatoskr.io/migration-wait: "true"
  policyTypes: [Egress]
  egress:
    # Include the service and post-DNAT API ports; CNI processing order varies.
    - ports:
        {{- range .Values.networkPolicies.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- with .Values.networkPolicies.extraEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ratatoskr.fullname" $ }}-external-egress
  labels:
    {{- include "ratatoskr.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [app, worker, scheduler, migration]
  policyTypes: [Egress]
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
