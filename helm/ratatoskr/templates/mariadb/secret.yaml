{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ratatoskr.mariadb.fullname" . }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    app.kubernetes.io/name: mariadb
  annotations:
    # Land before the StatefulSet starts so the secretKeyRef resolves
    # on first boot. Negative weight runs earlier in the pre-install /
    # pre-upgrade phase.
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    # Keep the Secret across upgrades; deleting it would invalidate
    # the running MariaDB which authenticates against these passwords.
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ .Values.mariadb.auth.rootPassword | quote }}
  DB_PASSWORD: {{ .Values.mariadb.auth.password | quote }}
  {{- if .Values.mariadb.auth.backupPassword }}
  MARIADB_BACKUP_PASSWORD: {{ .Values.mariadb.auth.backupPassword | quote }}
  {{- end }}
{{- end }}
