{{- if and .Values.unit3d.bootstrapAppKey (not .Values.unit3d.existingSecret) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ratatoskr.fullname" . }}-bootstrap
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/name: bootstrap-app-key
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
automountServiceAccountToken: true
{{- end }}
