{{- if and .Values.unit3d.bootstrapAppKey (not .Values.unit3d.existingSecret) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ratatoskr.fullname" . }}-bootstrap
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/name: bootstrap-app-key
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ratatoskr.fullname" . }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "ratatoskr.fullname" . }}-bootstrap
    namespace: {{ .Release.Namespace }}
{{- end }}
