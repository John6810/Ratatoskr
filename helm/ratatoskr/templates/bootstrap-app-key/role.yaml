{{- if and .Values.unit3d.bootstrapAppKey (not .Values.unit3d.existingSecret) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ratatoskr.fullname" . }}-bootstrap
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/name: bootstrap-app-key
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
# Minimum RBAC: get + patch on the chart-managed unit3d Secret only.
# resourceNames pins access to that one Secret — no wildcard on
# secrets/* in the namespace.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "ratatoskr.unit3d.fullname" . | quote }}]
    verbs: ["get", "patch"]
{{- end }}
