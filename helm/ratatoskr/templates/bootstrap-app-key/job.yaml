{{- if and .Values.unit3d.bootstrapAppKey (not .Values.unit3d.existingSecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ratatoskr.fullname" . }}-bootstrap-app-key
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/name: bootstrap-app-key
  annotations:
    # Hook-weight -3: AFTER chart-managed Secrets (-5) and SA/Role/
    # RoleBinding (-4), BEFORE the migrate Job (0). The bootstrap Job
    # patches the chart's unit3d Secret, so the Secret must exist first.
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "ratatoskr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/name: bootstrap-app-key
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ratatoskr.fullname" . }}-bootstrap
      # Pod-level: enforce non-root. Per-container UIDs differ (UNIT3D
      # image runs as UID 33, bitnami/kubectl as 1001 by convention).
      securityContext:
        runAsNonRoot: true
      # Two-container pattern: init container generates the key with
      # `php artisan key:generate --show`, writes it to a shared
      # emptyDir; main container reads from there and patches the Secret.
      initContainers:
        - name: generate-key
          image: {{ include "ratatoskr.unit3d.image" . | quote }}
          imagePullPolicy: {{ .Values.unit3d.image.pullPolicy | default "IfNotPresent" }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              php /app/artisan key:generate --show > /shared/app-key
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: bootstrap-cache
              mountPath: /app/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: patch-secret
          # Pinned to a Bitnami kubectl tag matching the cluster baseline.
          image: bitnami/kubectl:1.32
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              SECRET={{ include "ratatoskr.unit3d.fullname" . | quote }}

              # Read existing APP_KEY (may be missing).
              EXISTING=$(kubectl get secret "$SECRET" \
                -o jsonpath='{.data.APP_KEY}' 2>/dev/null \
                | base64 -d 2>/dev/null || echo "")

              if [ -n "$EXISTING" ]; then
                echo "APP_KEY already present in $SECRET — no-op."
                exit 0
              fi

              NEW_KEY=$(cat /shared/app-key)
              if [ -z "$NEW_KEY" ]; then
                echo "ERROR: generated APP_KEY is empty." >&2
                exit 1
              fi

              ENCODED=$(printf '%s' "$NEW_KEY" | base64 -w0)
              kubectl patch secret "$SECRET" \
                --type=merge \
                -p="{\"data\":{\"APP_KEY\":\"$ENCODED\"}}"

              echo "APP_KEY generated and patched into $SECRET."
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
