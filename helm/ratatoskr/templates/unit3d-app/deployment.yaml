{{- $component := "app" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ratatoskr.unit3d.fullname" . }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    app.kubernetes.io/name: unit3d-app
spec:
  replicas: {{ .Values.unit3d.replicas }}
  # Recreate strategy at base level: the unit3d-storage PVC is RWO by
  # default, RollingUpdate would deadlock on PVC handoff. prod-rwx
  # overlays patch to RollingUpdate + multi-replica via values.
  strategy:
    {{- if eq .Values.storage.accessMode "ReadWriteMany" }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
      app.kubernetes.io/name: unit3d-app
  template:
    metadata:
      labels:
        {{- include "ratatoskr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        app.kubernetes.io/name: unit3d-app
        ratatoskr.io/storage: {{ include "ratatoskr.fullname" . | quote }}
        ratatoskr.io/migration-wait: "true"
      annotations:
        ratatoskr.io/migration: {{ include "ratatoskr.migrate.fullname" . | quote }}
        # Pod rollout on ConfigMap content change (Helm equivalent of
        # Kustomize's configMapGenerator name-suffix-hash behaviour).
        checksum/config: {{ include (print $.Template.BasePath "/unit3d-app/configmap.yaml") . | sha256sum }}
        checksum/filesystems: {{ include (print $.Template.BasePath "/unit3d-app/configmap-filesystems.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.unit3d.podSecurityContext) .Values.unit3d.httpPodSecurityContext) | nindent 8 }}
      serviceAccountName: {{ include "ratatoskr.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "ratatoskr.storageAffinity" . | nindent 6 }}
      initContainers:
        {{- include "ratatoskr.workloadInit" . | nindent 8 }}
      containers:
        - name: unit3d-app
          image: {{ include "ratatoskr.unit3d.image" . | quote }}
          imagePullPolicy: {{ .Values.unit3d.image.pullPolicy | default "IfNotPresent" }}
          # Also supports older application images whose ENTRYPOINT reset CMD.
          args: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            {{- include "ratatoskr.unit3d.envFrom" . | nindent 12 }}
          env:
            {{- include "ratatoskr.unit3d.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.unit3d.resources | nindent 12 }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.unit3d.containerSecurityContext) .Values.unit3d.httpSecurityContext) | nindent 12 }}
          {{- with .Values.unit3d.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            {{- toYaml (.Values.unit3d.probes.startup | default (dict "exec" (dict "command" (list "curl" "--fail" "--silent" "--show-error" "--max-time" "4" "--output" "/dev/null" "http://127.0.0.1/")) "periodSeconds" 5 "timeoutSeconds" 4 "failureThreshold" 30)) | nindent 12 }}
          livenessProbe:
            {{- toYaml (.Values.unit3d.probes.liveness | default (dict "exec" (dict "command" (list "curl" "--fail" "--silent" "--show-error" "--max-time" "4" "--output" "/dev/null" "http://127.0.0.1/")) "periodSeconds" 30 "timeoutSeconds" 4 "failureThreshold" 3)) | nindent 12 }}
          readinessProbe:
            {{- toYaml (.Values.unit3d.probes.readiness | default (dict "exec" (dict "command" (list "curl" "--fail" "--silent" "--show-error" "--max-time" "4" "--output" "/dev/null" "http://127.0.0.1/")) "periodSeconds" 30 "timeoutSeconds" 4 "failureThreshold" 3)) | nindent 12 }}
          volumeMounts:
            - name: filesystems-config
              mountPath: /app/config/filesystems.php
              subPath: filesystems.php
              readOnly: true
            {{- if .Values.storage.enabled }}
            - name: storage
              mountPath: /app/storage
            {{- end }}
            - name: bootstrap-cache
              mountPath: /app/bootstrap/cache
            - name: caddy-data
              mountPath: /data/caddy
            - name: caddy-config
              mountPath: /config/caddy
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "ratatoskr.lifecycleVolumes" . | nindent 8 }}
        - name: filesystems-config
          configMap:
            name: {{ include "ratatoskr.fullname" . }}-unit3d-filesystems-config
        {{- if .Values.storage.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "ratatoskr.fullname" . }}-unit3d-storage
        {{- end }}
        - name: bootstrap-cache
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
