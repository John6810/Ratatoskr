apiVersion: v1
kind: Service
metadata:
  name: {{ include "ratatoskr.unit3d.fullname" . }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    app.kubernetes.io/name: unit3d-app
spec:
  type: ClusterIP
  selector:
    {{- include "ratatoskr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
    app.kubernetes.io/name: unit3d-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
