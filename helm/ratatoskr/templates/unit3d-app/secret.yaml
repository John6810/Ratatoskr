{{- if not .Values.unit3d.existingSecret }}
{{- if eq (include "ratatoskr.secretMissing" (dict "root" . "name" (include "ratatoskr.unit3d.fullname" .) "keys" (list "APP_KEY"))) "true" }}
{{- if and .Release.IsUpgrade .Values.unit3d.bootstrapAppKey }}
{{- fail "APP_KEY Secret is missing during upgrade; restore the original Secret instead of generating a new key" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ratatoskr.unit3d.fullname" . }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    app.kubernetes.io/name: unit3d-app
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  APP_KEY: {{ if .Values.unit3d.bootstrapAppKey }}{{ printf "base64:%s" (randBytes 32) | quote }}{{ else }}{{ .Values.unit3d.appKey | quote }}{{ end }}
  DEFAULT_OWNER_NAME: {{ .Values.unit3d.owner.name | quote }}
  DEFAULT_OWNER_EMAIL: {{ required "unit3d.owner.email is required for the initial owner" .Values.unit3d.owner.email | quote }}
  DEFAULT_OWNER_PASSWORD: {{ required "unit3d.owner.password is required for the initial owner" .Values.unit3d.owner.password | quote }}
{{- end }}
{{- end }}
{{- /* When .Values.unit3d.storage.s3 is configured (any disk on s3) and
       unit3d.storage.s3.existingSecret is empty, render a separate
       unit3d-storage Secret consumed via explicit per-disk key references.
       existingSecret uses configurable AWS key/secret field names. */}}
{{- if and (eq (include "ratatoskr.storage.s3Enabled" .) "true") (not .Values.unit3d.storage.s3.existingSecret) }}
{{- if eq (include "ratatoskr.secretMissing" (dict "root" . "name" (include "ratatoskr.storage.secretName" .) "keys" (list "FILESYSTEM_TORRENT_FILES_KEY" "FILESYSTEM_TORRENT_FILES_SECRET"))) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ratatoskr.fullname" . }}-unit3d-storage
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    app.kubernetes.io/name: unit3d-storage
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  {{- $s3 := .Values.unit3d.storage.s3 }}
  {{- range $disk := list "TORRENT_FILES" "SUBTITLE_FILES" "ATTACHMENT_FILES" }}
  FILESYSTEM_{{ $disk }}_KEY: {{ $s3.key | quote }}
  FILESYSTEM_{{ $disk }}_SECRET: {{ $s3.secret | quote }}
  FILESYSTEM_{{ $disk }}_REGION: {{ $s3.region | quote }}
  FILESYSTEM_{{ $disk }}_BUCKET: {{ $s3.bucket | quote }}
  FILESYSTEM_{{ $disk }}_ENDPOINT: {{ $s3.endpoint | quote }}
  FILESYSTEM_{{ $disk }}_USE_PATH_STYLE_ENDPOINT: {{ $s3.usePathStyleEndpoint | quote }}
  {{- end }}
{{- end }}
{{- end }}
