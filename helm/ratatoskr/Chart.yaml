# Chart metadata for ratatoskr — production deployment stack for
# UNIT3D Community Edition.
#
# version    — chart version (SemVer). Bumped on every chart change.
# appVersion — UNIT3D upstream version. Bumped only when UNIT3D upgrades.
#              Verified at v0.5.0-alpha.1 against
#              https://api.github.com/repos/HDInnovations/UNIT3D/releases/latest
#              (latest release: v9.2.0, published 2025-12-03).
apiVersion: v2
name: ratatoskr
description: >-
  Production deployment stack for UNIT3D Community Edition — Laravel-based
  private BitTorrent tracker. Bundles MariaDB, Redis, MeiliSearch, and the
  UNIT3D application via FrankenPHP.
type: application
version: 0.5.0-alpha.1
appVersion: "v9.2.0"
kubeVersion: ">=1.30.0-0"
keywords:
  - unit3d
  - bittorrent
  - tracker
  - laravel
  - frankenphp
home: https://github.com/John6810/Ratatoskr
sources:
  - https://github.com/John6810/Ratatoskr
  - https://github.com/HDInnovations/UNIT3D
maintainers:
  - name: John6810
    url: https://github.com/John6810
